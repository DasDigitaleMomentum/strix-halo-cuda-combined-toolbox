version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]

  # Directory "/" covers both Dockerfile and Dockerfile.rocm (Dependabot
  # matches any file name containing "dockerfile", case-insensitive).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
